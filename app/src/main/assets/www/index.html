<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Simulado ENEM – Inglês</title>
<style>
:root{--navy:#2D4C94;--royal:#2156B8;--red:#ED3237;--gold:#FECE6F;--paper:#F7F4EC;--ink:#1F2533;--muted:#5B6375;--green:#2EA05A}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{font-size:18px}header .bar{position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--navy) 60%,var(--red) 60%)}
main{padding:16px;max-width:760px;margin:auto}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px #0001}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin:8px 0;background:var(--royal);color:#fff}
.btn:disabled{opacity:.4}.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--royal);border:2px solid var(--royal)}
.tag{display:inline-block;background:#E4EAF6;color:var(--royal);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
.q img.z{width:220%;max-width:none}.q img{width:100%;border-radius:8px;border:1px solid #ddd}
button{font-family:inherit}
.alts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.alts button{padding:0;width:100%;font-size:20px;font-weight:800;border-radius:50%;aspect-ratio:1;border:2px solid var(--royal);background:#fff;color:var(--royal)}
.alts button.ok{background:var(--green);border-color:var(--green);color:#fff}.alts button.bad{background:var(--red);border-color:var(--red);color:#fff}
.tip{background:#FFF3D6;border-left:5px solid #B8860B;padding:12px;border-radius:8px;margin-top:10px}
.why{background:#E3F4EA;border-left:5px solid var(--green);padding:12px;border-radius:8px;margin-top:10px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.small{font-size:13px;color:var(--muted)}
.strat h2{color:var(--red)}
</style>
</head>
<body>
<header><b>Simulado ENEM · Inglês</b><span class="timer" id="tm"></span><div class="bar"></div></header>
<main id="app"></main>
<script>
const Q=[
{n:1,y:2024,a:'A',t:'Discourse markers',tip:'Scanning: ache “instead of” na letra. O que a canção propõe fazer no lugar de quê?',why:'“Instead of” indica substituição: amar em vez de polir as bombas da guerra santa. A canção propõe uma mudança de comportamento. “Bombs” e “holy war” são as iscas das letras D e E.'},
{n:2,y:'PPL 2019',a:'E',t:'Discourse markers',tip:'Compare os números do infográfico: o que “but” e “yet only” contrastam?',why:'“But” e “yet only” marcam contraste: 91% acham o inglês essencial, mas só 7% se sentem preparados.',chk:1},
{n:3,y:2023,a:'B',t:'Inferência',tip:'Leia o título e o último verso: o eu lírico se sente isolado ou ligado aos outros?',why:'“No man is an island… I am involved in mankind”: ninguém vive isolado, ideia de conexão.'},
{n:4,y:2022,a:'D',t:'Scanning',tip:'Procure frases com “Cuban” e “Miami”.',why:'“Everyone was Cuban… the Cuban community was culturally insular in Miami”: o autor destaca a integração da comunidade cubana.'},
{n:5,y:2019,a:'B',t:'Skimming',tip:'Leia só o título e os subtítulos em negrito.',why:'Os subtítulos (Allergy Fighters, Good for the Heart…) listam benefícios dos pets para a saúde.',chk:1},
{n:6,y:2023,a:'D',t:'Inferência',tip:'Repare na repetição “We carry…”: o que o poema enumera?',why:'A repetição reúne origens, ofícios e histórias diferentes: experiências plurais.'},
{n:7,y:2025,a:'D',t:'Inferência',tip:'Qual é a opinião da autora sobre a função da filosofia?',why:'Para Davis, a filosofia deve tratar de problemas humanos: aproximá-la dos problemas sociais.'},
{n:8,y:2019,a:'B',t:'If clauses',tip:'Skimming: o texto repete a mesma estrutura “If children live with…, they learn…”.',why:'A repetição da if clause mostra que as crianças aprendem com o que vivem.'},
{n:9,y:2016,a:'D',t:'If clauses',tip:'Scanning: procure “if it remains Italian-speaking”.',why:'A universidade adota o inglês para não se isolar: “if it remains Italian-speaking it risks isolation”.'},
{n:10,y:2021,a:'C',t:'If clauses',tip:'Leia com atenção as últimas frases do texto.',why:'A conclusão (“society is to blame… think for ourselves”) aponta a necessidade de reflexão dos fãs.'},
{n:11,y:2024,a:'A',t:'If clauses',tip:'Scanning: o que diziam ao autor “If you want to be American…”?',why:'“If you want to be American, speak ‘American’” revela o repúdio ao sotaque espanhol.'},
{n:12,y:2020,a:'C',t:'If clauses',tip:'Procure a fala de Ifemelu com “if”.',why:'“It’s not hard to comb if you moisturize it”: Ifemelu defende o cabelo natural, uma atitude de resistência.'},
{n:13,y:2018,a:'E',t:'If clauses',tip:'Scanning no Texto II: ache “If… then”.',why:'O autor critica a concepção de ensino como “sit-and-get”, transmissão passiva.'},
{n:14,y:2025,a:'E',t:'If clauses',tip:'Scanning: o que o texto diz sobre a “snowflake generation”?',why:'São jovens “so delicate they can’t handle controversial ideas”: avessos a contrariedades.'}];
const S=[
['Enunciado primeiro','O enunciado vem em português. Leia-o antes do texto: ele diz o que procurar (tema, objetivo, sentido de uma expressão).'],
['Skimming','Leitura rápida para captar a ideia geral: título, imagem, fonte, data, primeira e última frase. Pergunte: sobre o que é? Que gênero é?'],
['Scanning','Busca de uma informação específica: nomes, números, datas, cognatos ou a palavra citada no enunciado. Volte só ao trecho que interessa.'],
['Inferência','Ler nas entrelinhas: o que o texto sugere sem dizer. Observe tom, conectores e escolhas de palavras.'],
['Pistas linguísticas','If clauses mostram condição e consequência; discourse markers (however, but, instead of, as a result…) mostram a relação entre ideias.'],
['Elimine','Descarte alternativas que extrapolam o texto, o contradizem ou falam de outro tema.']];
const $=id=>document.getElementById(id);let st={i:0,score:0,ans:{},t0:0},timer,view='home';
// Chamado pelo botão Voltar do Android (MainActivity); false = sair do app.
function back(){if(view=='home')return false;if(view=='q'&&st.i>0){go(-1);return true}home();return true}
function save(){try{localStorage.setItem('best',Math.max(+localStorage.getItem('best')||0,st.score))}catch(e){}}
function home(){view='home';clearInterval(timer);$('tm').textContent='';let best=0;try{best=+localStorage.getItem('best')||0}catch(e){}
$('app').innerHTML=`<div class="card"><h1>Treine para o ENEM</h1><p>${Q.length} questões reais de inglês (ENEM 2016–2025) com dicas de skimming, scanning e inferência.</p>${best?`<p class="small">Seu melhor resultado: ${best}/${Q.length}</p>`:''}
<button class="btn" onclick="start()">Começar simulado</button><button class="btn ghost" onclick="strat()">Estratégias de leitura</button></div>
<p class="small">Questões: Inep/ENEM. App de apoio ao aulão de Língua Inglesa – UNEB.</p>`}
function strat(){view='strat';$('app').innerHTML=S.map((s,k)=>`<div class="card strat"><h2>${k+1}. ${s[0]}</h2><p>${s[1]}</p></div>`).join('')+`<button class="btn" onclick="start()">Ir para o simulado</button><button class="btn ghost" onclick="home()">Voltar</button>`;scrollTo(0,0)}
function start(){st={i:0,score:0,ans:{},t0:Date.now()};clearInterval(timer);timer=setInterval(()=>{const s=Math.floor((Date.now()-st.t0)/1000);$('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);show()}
function hint(){$('hint').innerHTML=`<div class="tip"><b>Dica:</b> ${Q[st.i].tip}</div>`}
function show(){view='q';const q=Q[st.i],done=st.ans[st.i];
$('app').innerHTML=`<div class="card q"><span class="tag">Questão ${q.n} · ENEM ${q.y} · ${q.t}</span><p class="small">Toque na imagem para ampliar.</p>
<div style="overflow:auto"><img src="img/q${String(q.n).padStart(2,'0')}.jpg" alt="Questão ${q.n}" onclick="this.classList.toggle('z')"></div>
<div class="alts">${'ABCDE'.split('').map(l=>`<button id="b${l}" onclick="pick('${l}')" ${done?'disabled':''}>${l}</button>`).join('')}</div>
<div id="hint"></div><div id="fb"></div><button class="btn ghost" onclick="hint()">Ver dica</button></div>
<div class="row"><button class="btn ghost" onclick="go(-1)" ${st.i?'':'disabled'}>Anterior</button><button class="btn" onclick="go(1)">${st.i==Q.length-1?'Ver resultado':'Próxima'}</button></div>`;
if(done)mark(done);scrollTo(0,0)}
function pick(l){if(st.ans[st.i])return;st.ans[st.i]=l;if(l==Q[st.i].a)st.score++;mark(l)}
function mark(l){const q=Q[st.i];'ABCDE'.split('').forEach(x=>$('b'+x).disabled=true);$('b'+q.a).classList.add('ok');if(l!=q.a)$('b'+l).classList.add('bad');
$('fb').innerHTML=`<div class="why"><b>${l==q.a?'Acertou!':'Resposta: '+q.a}</b> ${q.why}</div>`}
function go(d){if(st.i+d>=Q.length)return result();st.i=Math.max(0,st.i+d);show()}
function result(){view='res';clearInterval(timer);save();const m=$('tm').textContent,pct=st.score/Q.length;
$('app').innerHTML=`<div class="card"><h1>${st.score}/${Q.length}</h1><p>Tempo: ${m||'00:00'}</p><p>${pct>=.75?'Excelente! Continue assim.':pct>=.5?'Bom resultado! Revise as dicas das questões que errou.':'Revise as estratégias e tente de novo: a prática faz diferença.'}</p>
<p class="small">No ENEM, você tem em média 3 minutos por questão.</p><button class="btn" onclick="start()">Refazer</button><button class="btn ghost" onclick="strat()">Revisar estratégias</button><button class="btn ghost" onclick="home()">Início</button></div>`}
home();
</script>
</body>
</html>
